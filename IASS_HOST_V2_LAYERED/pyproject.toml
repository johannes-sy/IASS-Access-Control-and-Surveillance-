[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iass-host"
version = "1.2.0"
description = "IASS Host V1 -- layered camera/AI/security/hardware access-control system"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "opencv-python-headless",
    "numpy",
    "onnxruntime>=1.18,<2",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
